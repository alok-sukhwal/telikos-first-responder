[project]
name = "telikos-first-responder"
version = "0.1.0"
description = "A chat agent that answers users' functional questions from a local knowledge base."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
]

# This is an application, not a distributable package — don't build/install the project itself.
[tool.uv]
package = false

# The project isn't installed (package = false), so put the repo root on sys.path for imports.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Coverage measures the package and the Streamlit entry point, which the AppTest suite drives.
# `uv run pytest --cov` reads these; plain `uv run pytest` stays fast and ungated.
[tool.coverage.run]
source = ["first_responder", "app"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
