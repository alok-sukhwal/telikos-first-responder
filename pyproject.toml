[project]
name = "telikos-first-responder"
version = "0.1.0"
description = "A chat agent that answers users' functional questions from a local knowledge base."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.7",
]

# This is an application, not a distributable package — don't build/install the project itself.
[tool.uv]
package = false

# The project isn't installed (package = false), so put the repo root on sys.path for imports.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
